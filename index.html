<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagen Boost</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        padding: 0;
        background: #f8f8f8;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        color: #111;
    }

    .container {
        max-width: 600px;
        padding: 40px;
    }

    img {
        max-width: 220px;
        margin-bottom: 40px;
    }

    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 36px;
        margin-bottom: 15px;
        letter-spacing: 1px;
    }

    p {
        font-size: 16px;
        color: #555;
        margin-bottom: 10px;
    }

    .subtle {
        font-size: 14px;
        color: #888;
        margin-top: 20px;
    }
</style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Anagen Boost Logo">
    <h1>Something Beautiful Is Growing</h1>
    <p>Our website is currently under construction.</p>
    <p>Check back soon for the official launch.</p>
    <div class="subtle">© 2026 Anagen Boost</div>
</div>

</body>
</html>
