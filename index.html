<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagen Boost</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    background: #f8f8f8;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    color: #111;
}

.container {
    max-width: 600px;
    padding: 40px;
}

img {
    max-width: 300px;
    margin-bottom: 40px;
}

.launch {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 20px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

p {
    font-size: 16px;
    color: #555;
    margin-bottom: 30px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

input {
    padding: 12px;
    width: 260px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
}

button {
    padding: 12px 20px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    width: 260px;
}

button:hover {
    opacity: 0.9;
}

#msg {
    margin-top: 15px;
    font-size: 14px;
    color: #666;
}

.footer {
    font-size: 13px;
    color: #888;
    margin-top: 40px;
}
</style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="Anagen Boost Logo">

    <div class="launch">Launching Spring 2026</div>

    <h1>Elevated Hair Wellness</h1>

    <p>Join the exclusive waitlist and be the first to experience Anagen Boost.</p>

    <form id="waitlistForm">
        <input id="name" type="text" placeholder="Full Name" required>
        <input id="email" type="email" placeholder="Email Address" required>
        <input id="phone" type="tel" placeholder="Phone Number (optional)">
        <button type="submit" id="btn">Join the Waitlist</button>
    </form>

    <p id="msg"></p>

    <div class="footer">
  © 2026 Anagen Boost, LLC | 
  <a href="privacy.html" style="color:#888; text-decoration:none;">Privacy Policy</a>
</div>


</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxUxyTqE6KP23l1-Py7A8qgbsPeW9OqqBBHtc_aoCnCpZRFD0JV-oAIzTIjqx_bOKMw7g/exec";

const form = document.getElementById("waitlistForm");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.textContent = "Submitting...";

    try {
        await fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                name: nameInput.value.trim(),
                email: emailInput.value.trim(),
                phone: phoneInput.value.trim(),
                source: window.location.hostname
            })
        });

        msg.textContent = "You're officially on the list. Welcome.";
        form.reset();

    } catch (err) {
        msg.textContent = "Network error. Please try again.";
    } finally {
        btn.disabled = false;
    }
});
</script>

</body>
</html>
